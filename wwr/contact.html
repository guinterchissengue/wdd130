<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Rapids Rafting</title>
  <meta name="description" content="Contact White Rapids Rafting for reservations, general inquiries, or website suggestions.
     Find our location, team, and contact details here.">
  <meta name="author" content="Guinter Chissengue">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/logo.png" alt="White Rapids Rafting Logo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section class="company-info">
      <h2>Our Information</h2>
      <p><strong>Address:</strong> Av. 7 de Setembro, Maxixe, Inhambane, Mozambique</p>
      <p><strong>Phone:</strong> (258) 846112145</p>
      <p><strong>Email:</strong> info@whiterapidsrafting.com</p>

      <iframe
        src="https://www.google.com/maps?q=Av.+7+de+Setembro,+Maxixe,+Inhambane,+Mozambique&output=embed"
        width="600" height="450" allowfullscreen="" loading=" lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="White Rapids Rafting Location - Maxixe, Mozambique">
      </iframe>

    </section>

    <section class="employees">
      <h2>Meet Our Team</h2>
      <div class="employee-gallery">
        <figure>
          <img src="images/employer-1.jpg" alt="Jack Johnson - Senior River Guide">
          <figcaption>Jack Johnson – Senior River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employer-2.jpg" alt="Alien Smith - Reservations Manager">
          <figcaption>Alien Smith – Reservations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/employer-3.jpg" alt="Travis Scott - Safety Instructor">
          <figcaption>Travis Scott – Safety Instructor</figcaption>
        </figure>
      </div>
    </section>

    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form>

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>

        <fieldset>
          <legend>Purpose of Message</legend>

          <input type="radio" id="purpose-general" name="purpose" value="general" required>
          <label for="purpose-general">General Inquiry</label>

          <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
          <label for="purpose-reservation">Reservation Question</label>

          <input type="radio" id="purpose-website" name="purpose" value="website">
          <label for="purpose-website">Website Suggestion</label>
        </fieldset>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>


        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Please subscribe me to the monthly newsletter</label>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 White Rapids Rafting | Guinter Chissengue</p>
    <nav class="socialmedia">
      <a href="#"><img src="images/icon-4.png" alt="Facebook"></a>
      <a href="#"><img src="images/icon-2.png" alt="Instagram"></a>
      <a href="#"><img src="images/icon-7.png" alt="Twitter"></a>
    </nav>
  </footer>
</body>

</html>
